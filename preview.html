<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<title>UniStock — Vista de Stock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:      #f4f3ef;
  --bg2:     #eeede8;
  --surface: #ffffff;
  --border:  #e6e4de;
  --border2: #d4d1c9;
  --text:    #181714;
  --text2:   #636058;
  --text3:   #a09d96;
  --accent:  #d4522a;
  --accent2: #fdf0ec;
  --green:   #2a7d4f;
  --green2:  #ecf7f1;
  --amber:   #b87314;
  --amber2:  #fdf6e8;
  --red:     #be3a2b;
  --red2:    #fdf0ee;
  --r:       10px;
  --r2:      6px;
  --font:    'DM Sans', sans-serif;
  --display: 'Syne', sans-serif;
  --mono:    'DM Mono', monospace;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: var(--font); background: var(--bg); color: var(--text);
  min-height: 100vh; -webkit-font-smoothing: antialiased;
}

/* ── TOPBAR ── */
.topbar {
  background: var(--surface); border-bottom: 1px solid var(--border);
  padding: 0 24px; height: 56px; display: flex; align-items: center;
  justify-content: space-between; position: sticky; top: 0; z-index: 100;
  box-shadow: 0 1px 3px rgba(0,0,0,.06);
}
.logo { display: flex; align-items: center; gap: 10px; }
.logo-mark {
  width: 32px; height: 32px; background: var(--text); border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
}
.logo-mark svg { width: 16px; height: 16px; stroke: white; fill: none; stroke-width: 1.5; }
.logo-name { font-family: var(--display); font-size: 16px; font-weight: 700; }
.logo-tag {
  font-size: 11px; font-family: var(--mono); color: var(--accent);
  background: var(--accent2); border: 1px solid rgba(212,82,42,.2);
  padding: 2px 8px; border-radius: 20px; letter-spacing: .04em;
}
.topbar-right { display: flex; align-items: center; gap: 10px; }
.read-only-badge {
  font-size: 11px; font-weight: 600; color: var(--text3);
  background: var(--bg2); border: 1px solid var(--border2);
  padding: 4px 10px; border-radius: 20px; letter-spacing: .04em;
  display: flex; align-items: center; gap: 5px;
}
.read-only-badge svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 2; }
.last-updated { font-size: 12px; color: var(--text3); font-family: var(--mono); }

/* ── MAIN ── */
.main { max-width: 1200px; margin: 0 auto; padding: 28px 24px 60px; }

/* ── HERO ── */
.hero {
  background: var(--text); color: white; border-radius: 14px;
  padding: 28px 32px; margin-bottom: 24px;
  display: flex; align-items: center; justify-content: space-between; gap: 20px;
  flex-wrap: wrap;
}
.hero-title { font-family: var(--display); font-size: 26px; font-weight: 800; margin-bottom: 4px; }
.hero-sub { font-size: 14px; color: rgba(255,255,255,.55); }
.hero-stats { display: flex; gap: 24px; flex-wrap: wrap; }
.hstat { text-align: center; }
.hstat-val { font-family: var(--mono); font-size: 28px; font-weight: 700; line-height: 1; }
.hstat-lbl { font-size: 11px; color: rgba(255,255,255,.5); margin-top: 3px; letter-spacing: .04em; text-transform: uppercase; }
.hstat-val.green { color: #6ee7a8; }
.hstat-val.amber { color: #fcd34d; }
.hstat-val.red   { color: #fca5a5; }

/* ── FILTERS ── */
.filters-bar {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r); padding: 14px 16px;
  display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
  margin-bottom: 20px;
}
.search-wrap { position: relative; flex: 1; min-width: 220px; }
.search-wrap svg {
  position: absolute; left: 11px; top: 50%; transform: translateY(-50%);
  width: 15px; height: 15px; stroke: var(--text3); fill: none; stroke-width: 2; pointer-events: none;
}
input[type=text], select {
  font-family: var(--font); font-size: 14px; color: var(--text);
  background: var(--bg); border: 1.5px solid var(--border);
  border-radius: var(--r2); padding: 9px 12px; outline: none;
  transition: border .15s; width: 100%;
}
input[type=text] { padding-left: 34px; }
input[type=text]:focus, select:focus { border-color: var(--text); }
input::placeholder { color: var(--text3); }
select { min-width: 150px; width: auto; cursor: pointer; }
.filter-count {
  font-size: 12px; color: var(--text3); font-family: var(--mono);
  white-space: nowrap; margin-left: auto;
}

/* ── VIEW TOGGLE ── */
.view-toggle {
  display: flex; gap: 4px; background: var(--bg2);
  border: 1px solid var(--border); border-radius: var(--r2); padding: 3px;
}
.vt-btn {
  padding: 6px 10px; border: none; border-radius: 4px; cursor: pointer;
  background: none; color: var(--text3); transition: all .15s;
  display: flex; align-items: center;
}
.vt-btn svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2; }
.vt-btn.active { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.1); }

/* ── CATEGORY SECTION ── */
.cat-section { margin-bottom: 28px; }
.cat-header {
  display: flex; align-items: center; gap: 10px; margin-bottom: 12px;
  padding-bottom: 10px; border-bottom: 1.5px solid var(--border);
}
.cat-icon { display: flex; align-items: center; width: 20px; height: 20px; flex-shrink: 0; }
.cat-name { font-family: var(--display); font-size: 15px; font-weight: 700; }
.cat-meta { font-size: 12px; color: var(--text3); font-family: var(--mono); margin-left: auto; }

/* ── GRID VIEW ── */
.product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px,1fr)); gap: 10px; }
.product-card {
  background: var(--surface); border: 1.5px solid var(--border);
  border-radius: var(--r); padding: 16px; transition: box-shadow .15s;
}
.product-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,.08); }
.product-card.out  { border-color: var(--red);   background: var(--red2); }
.product-card.low  { border-color: rgba(184,115,20,.4); background: var(--amber2); }
.pc-label { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--text3); margin-bottom: 4px; }
.pc-name  { font-size: 14px; font-weight: 600; margin-bottom: 2px; line-height: 1.3; }
.pc-meta  { font-size: 11.5px; color: var(--text3); font-family: var(--mono); margin-bottom: 14px; }
.pc-foot  { display: flex; align-items: flex-end; justify-content: space-between; }
.pc-qty   { font-family: var(--mono); font-size: 32px; font-weight: 700; line-height: 1; color: var(--green); }
.pc-qty.low { color: var(--amber); }
.pc-qty.out { color: var(--red); }
.pc-uds   { font-size: 11px; color: var(--text3); margin-top: 2px; }
.pc-badge {
  font-size: 10.5px; font-weight: 700; padding: 3px 9px; border-radius: 20px;
  letter-spacing: .03em;
}
.pc-badge.ok  { background: var(--green2); color: var(--green); }
.pc-badge.low { background: var(--amber2); color: var(--amber); }
.pc-badge.out { background: var(--red2);   color: var(--red); }

/* ── TABLE VIEW ── */
.table-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); overflow: hidden; }
table { width: 100%; border-collapse: collapse; }
thead { background: var(--bg2); }
th { padding: 10px 14px; text-align: left; font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--text3); white-space: nowrap; border-bottom: 1px solid var(--border); }
td { padding: 11px 14px; font-size: 13.5px; border-bottom: 1px solid var(--border); vertical-align: middle; }
tr:last-child td { border-bottom: none; }
tr:hover td { background: var(--bg2); }
.badge {
  display: inline-flex; align-items: center; font-size: 11px; font-weight: 700;
  padding: 2px 8px; border-radius: 20px; font-family: var(--mono); white-space: nowrap;
}
.badge.ok  { background: var(--green2); color: var(--green); }
.badge.low { background: var(--amber2); color: var(--amber); }
.badge.out { background: var(--red2);   color: var(--red); }
.badge.neutral { background: var(--bg2); color: var(--text2); border: 1px solid var(--border); }
.qty-big { font-family: var(--mono); font-size: 18px; font-weight: 700; }
.qty-big.ok  { color: var(--green); }
.qty-big.low { color: var(--amber); }
.qty-big.out { color: var(--red); }

/* ── EMPTY ── */
.empty {
  text-align: center; padding: 60px 20px; color: var(--text3);
}
.empty-icon { font-size: 36px; margin-bottom: 12px; }
.empty h3 { font-size: 16px; color: var(--text2); margin-bottom: 6px; }
.empty p  { font-size: 14px; }

/* ── LOADER ── */
#loader {
  position: fixed; inset: 0; background: var(--bg); z-index: 9999;
  display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 14px;
  transition: opacity .4s;
}
.spinner {
  width: 32px; height: 32px; border: 3px solid var(--border2);
  border-top-color: var(--text); border-radius: 50%; animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loader-text { font-size: 13px; color: var(--text3); font-family: var(--mono); }

/* ── MOBILE ── */
@media (max-width: 680px) {
  .main { padding: 16px 14px 48px; }
  .hero { padding: 20px; }
  .hero-title { font-size: 20px; }
  .hstat-val { font-size: 22px; }
  .filters-bar { gap: 8px; }
  .product-grid { grid-template-columns: repeat(auto-fill, minmax(160px,1fr)); }
  .topbar { padding: 0 16px; }
  .last-updated { display: none; }
  table { min-width: 580px; }
  .table-wrap { overflow-x: auto; }
}

/* ── CAT ICONS ── */
.cat-svg { display:inline-flex;align-items:center;flex-shrink:0; }
</style>
</head>
<body>

  <div class="spinner"></div>

<!-- Topbar -->
<header class="topbar">

<script>

var EMOJI_TO_IC = { '👕':'[IC16]', '🎒':'[IC17]', '🎧':'[IC18]', '🦺':'[IC19]' };

function getCatIcon(val, size) {
  size = size || '16px';
  var key = EMOJI_TO_IC[val] || val;
  if (CAT_ICONS[key]) return '<span class="cat-svg" style="width:'+size+';height:'+size+'">' + CAT_ICONS[key] + '</span>';
  return '<span>' + (val||'') + '</span>';
}

function getType(id) { return TYPES.find(function(t){ return t.id===id; }); }
function getCat(id)  { return CATS.find(function(c){ return c.id===id; }); }

function stockClass(p) {
  if (p.qty === 0) return 'out';
  if (p.qty < (p.low_stock_threshold || 5)) return 'low';
  return 'ok';
}

function fmtDate(d) {
  if (!d) return '—';
  var dt = new Date(d + 'T12:00:00');
  return dt.toLocaleDateString('es-MX', { day:'numeric', month:'short', year:'numeric' });
}

// ── INIT ────────────────────────────────────────────────────────────────────
(async function() {
  try {
    await loadFromSupabase(SUPABASE_URL, SUPABASE_KEY);
    populateCatFilter();
    updateHeroStats();
    applyFilters();
    document.getElementById('last-updated').textContent = 'Actualizado ' + new Date().toLocaleTimeString('es-MX', {hour:'2-digit',minute:'2-digit'});
    document.getElementById('hero-date').textContent = 'Riverline Ergonomic · ' + new Date().toLocaleDateString('es-MX',{day:'numeric',month:'long',year:'numeric'});
  } catch(e) {
    showError('Error al cargar: ' + e.message);
  }
  hideLoader();
})();

async function loadFromSupabase(url, key) {
  if (!window.supabase) {
    await new Promise(function(res, rej) {
      var s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js';
      s.onload = res; s.onerror = function() { rej(new Error('No se cargó Supabase')); };
      document.head.appendChild(s);
    });
  }
  SB = window.supabase.createClient(url, key);
  var r = await Promise.all([
    SB.from('categories').select('*').order('name'),
    SB.from('product_types').select('*').order('name'),
    SB.from('products').select('*').order('created_at'),
  ]);
  if (r[0].error) throw new Error(r[0].error.message);
  CATS  = r[0].data || [];
  TYPES = r[1].data || [];
  PRODS = r[2].data || [];
}

function loadFromLocal() {
  var raw = localStorage.getItem('unistock-local');
  if (!raw) return;
  var d = JSON.parse(raw);
  CATS  = d.cats  || [];
  TYPES = d.types || [];
  PRODS = d.prods || [];
}

function hideLoader() {
  var l = document.getElementById('loader');
  l.style.opacity = '0';
  setTimeout(function() { l.style.display = 'none'; }, 400);
}

function showError(msg) {
  hideLoader();
  document.getElementById('stock-content').innerHTML =
    '<div class="empty"><div class="empty-icon">⚠️</div><h3>Error</h3><p>' + msg + '</p></div>';
}

// ── FILTERS ─────────────────────────────────────────────────────────────────
function populateCatFilter() {
  var sel = document.getElementById('f-cat');
  CATS.forEach(function(c) {
    var o = document.createElement('option'); o.value = c.id; o.textContent = c.name;
    sel.appendChild(o);
  });
}

function updateHeroStats() {
  var total = PRODS.reduce(function(s,p){ return s+p.qty; }, 0);
  var low   = PRODS.filter(function(p){ return p.qty>0 && p.qty<(p.low_stock_threshold||5); }).length;
  var out   = PRODS.filter(function(p){ return p.qty===0; }).length;
  document.getElementById('stat-refs').textContent  = PRODS.length;
  document.getElementById('stat-total').textContent = total;
  document.getElementById('stat-low').textContent   = low;
  document.getElementById('stat-out').textContent   = out;
}

function getFiltered() {
  var q    = (document.getElementById('q').value || '').toLowerCase();
  var catF = document.getElementById('f-cat').value;
  var genF = document.getElementById('f-gen').value;
  var stkF = document.getElementById('f-stk').value;
  return PRODS.filter(function(p) {
    if (catF && p.category_id !== catF) return false;
    if (genF && p.gender !== genF) return false;
    if (stkF && stockClass(p) !== stkF) return false;
    if (q) {
      var t = getType(p.type_id); var c = getCat(p.category_id);
      var str = [t&&t.name, p.color, p.size, p.gender, p.sku, c&&c.name].join(' ').toLowerCase();
      if (!str.includes(q)) return false;
    }
    return true;
  });
}

function applyFilters() {
  var list = getFiltered();
  document.getElementById('filter-count').textContent = list.length + ' artículos';
  if (_view === 'grid') renderGrid(list);
  else renderTable(list);
}

function setView(v) {
  _view = v;
  document.getElementById('vt-grid').classList.toggle('active', v === 'grid');
  document.getElementById('vt-table').classList.toggle('active', v === 'table');
  applyFilters();
}

// ── RENDER GRID ─────────────────────────────────────────────────────────────
function renderGrid(list) {
  var el = document.getElementById('stock-content');
  if (!list.length) {
    el.innerHTML = '<div class="empty"><div class="empty-icon">🔍</div><h3>Sin resultados</h3><p>Ajusta la búsqueda o los filtros</p></div>';
    return;
  }
  // Group by category
  var groups = {};
  list.forEach(function(p) {
    var cid = p.category_id || '__none__';
    if (!groups[cid]) groups[cid] = [];
    groups[cid].push(p);
  });

  var html = '';
  Object.keys(groups).forEach(function(cid) {
    var cat   = getCat(cid);
    var items = groups[cid];
    var total = items.reduce(function(s,p){ return s+p.qty; }, 0);
    html += '<div class="cat-section">';
    html += '<div class="cat-header">';
    html += getCatIcon(cat ? cat.icon : '', '20px');
    html += '<span class="cat-name" style="color:'+(cat&&cat.color?cat.color:'var(--text)')+'">'+((cat&&cat.name)||'Sin categoría')+'</span>';
    html += '<span class="cat-meta">'+items.length+' refs · '+total+' uds</span>';
    html += '</div>';
    html += '<div class="product-grid">';
    items.forEach(function(p) {
      var t  = getType(p.type_id);
      var sc = stockClass(p);
      var labels = {ok:'OK', low:'Bajo', out:'Sin stock'};
      html += '<div class="product-card '+sc+'">';
      html += '<div class="pc-label">'+(t&&t.name||'?')+'</div>';
      html += '<div class="pc-name">'+p.color+'</div>';
      html += '<div class="pc-meta">Talla '+p.size+' · '+(p.gender||'')+''+(p.sku?' · '+p.sku:'')+'</div>';
      html += '<div class="pc-foot">';
      html += '<div><div class="pc-qty '+sc+'">'+p.qty+'</div><div class="pc-uds">unidades</div></div>';
      html += '<span class="pc-badge '+sc+'">'+labels[sc]+'</span>';
      html += '</div></div>';
    });
    html += '</div></div>';
  });
  el.innerHTML = html;
}

// ── RENDER TABLE ─────────────────────────────────────────────────────────────
function renderTable(list) {
  var el = document.getElementById('stock-content');
  if (!list.length) {
    el.innerHTML = '<div class="empty"><div class="empty-icon">🔍</div><h3>Sin resultados</h3><p>Ajusta la búsqueda o los filtros</p></div>';
    return;
  }
  var labels = {ok:'OK', low:'Bajo', out:'Sin stock'};
  var rows = list.map(function(p) {
    var t  = getType(p.type_id); var c = getCat(p.category_id);
    var sc = stockClass(p);
    return '<tr>'
      + '<td><span style="display:inline-flex;align-items:center;gap:6px">'+getCatIcon(c&&c.icon||'','15px')+'<span style="font-size:12.5px;color:var(--text2)">'+(c&&c.name||'—')+'</span></span></td>'
      + '<td><strong>'+(t&&t.name||'—')+'</strong></td>'
      + '<td>'+p.color+'</td>'
      + '<td><span class="badge neutral">'+p.size+'</span></td>'
      + '<td>'+(p.gender||'—')+'</td>'
      + '<td style="font-family:var(--mono);font-size:12px;color:var(--text3)">'+(p.sku||'—')+'</td>'
      + '<td><span class="qty-big '+sc+'">'+p.qty+'</span></td>'
      + '<td><span class="badge '+sc+'">'+labels[sc]+'</span></td>'
      + '</tr>';
  }).join('');
  el.innerHTML = '<div class="table-wrap"><table>'
    + '<thead><tr><th>Categoría</th><th>Artículo</th><th>Color</th><th>Talla</th><th>Género</th><th>SKU</th><th>Stock</th><th>Estado</th></tr></thead>'
    + '<tbody>' + rows + '</tbody></table></div>';
}
</script>
</body>
